name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: python -m pip install pytest pytest-asyncio aiohttp ruff==0.14.6
      - name: Lint Python
        run: ruff check custom_components tests
      - name: Run tests
        run: python -m pytest tests -q

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          # HACS "topics" checks GitHub About metadata, not git. This repo
          # currently has no topics, which is the only failing Validate
          # check (hassfest, tests, and the other 8 HACS checks pass).
          # Topics cannot be set from a commit or GITHUB_TOKEN (needs
          # repository Administration). Keep the rest of HACS validation
          # gating PRs; add topics in GitHub About (for example hacs,
          # home-assistant, custom-integration, dali) before submitting
          # to hacs/default, then drop this ignore.
          ignore: topics

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
