[project]
name = "atx-led-ha"
version = "0.1.1"
description = "Home Assistant custom integration for a local ATX LED DALI hub"
requires-python = ">=3.12"
readme = "README.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "aiohttp>=3.9",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["tests"]
